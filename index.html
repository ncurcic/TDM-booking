<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TDM Booking</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17263b;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#173b69;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:22px;margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 13px;background:#2469b5;color:white}button.secondary{background:#e5edf6;color:#173b69}.wrap{padding:12px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.toolbar input{padding:9px;border:1px solid #cbd6e2;border-radius:8px}.board{overflow:auto;background:white;border:1px solid #d8e1eb;border-radius:12px;max-height:75vh}.grid{display:grid;grid-template-columns:150px repeat(21,45px);width:max-content}.cell{height:43px;border-right:1px solid #e6eaf0;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;justify-content:center;font-size:12px}.sticky{position:sticky;left:0;z-index:2;background:white;justify-content:flex-start;padding:0 8px;font-weight:600}.head{position:sticky;top:0;z-index:3;background:#e8f1fb;font-weight:700}.head.sticky{z-index:4;background:#dceafa}.weekend{background:#f5f7fa}.slot{cursor:pointer}.slot:hover{background:#d6e9ff}.booking{background:#45a8a2;color:white;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;cursor:pointer;font-size:11px;width:100%;height:30px;display:flex;align-items:center}.legend{font-size:12px;color:#526477;margin-top:10px}dialog{border:0;border-radius:14px;max-width:420px;width:calc(100% - 24px);box-shadow:0 20px 70px #0005}form{display:grid;gap:10px}label{display:grid;gap:4px;font-size:13px;font-weight:600}form input,form select{padding:10px;border:1px solid #cbd6e2;border-radius:8px;width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}#delete{background:#b43c44}.hint{color:#64748b;font-size:12px;margin:5px 0} @media(max-width:600px){header{padding:12px}.grid{grid-template-columns:110px repeat(21,45px)}.wrap{padding:7px}}
</style></head><body><header><h1>🏔️ TDM Booking</h1><span>Konaci • Kopaonik</span></header><div class="wrap"><div class="toolbar"><button id="prev">◀ 7 dana</button><button class="secondary" id="today">Danas</button><button id="next">7 dana ▶</button><button id="new">+ Rezervacija</button><button class="secondary" id="export">Sačuvaj kopiju</button><label style="display:inline">Uvezi kopiju <input type="file" id="import" accept="application/json" style="max-width:155px"></label></div><div id="range" class="hint"></div><div class="board"><div class="grid" id="grid"></div></div><p class="legend">Dodirni slobodan datum da dodaš rezervaciju ili postojeću rezervaciju da je izmeniš. Dan odlaska nije zauzet. Podaci se čuvaju samo u ovom pregledaču — redovno koristi „Sačuvaj kopiju“.</p></div><dialog id="modal"><form id="form"><h2 id="formTitle" style="margin:0">Rezervacija</h2><input type="hidden" id="id"><label>Apartman<select id="unit" required></select></label><label>Gost<input id="guest" required maxlength="120" placeholder="Ime i prezime"></label><label>Dolazak<input type="date" id="start" required></label><label>Odlazak<input type="date" id="end" required></label><label>Telefon (opciono)<input id="phone" type="tel"></label><label>Napomena (opciono)<input id="note"></label><div class="actions"><button type="submit">Sačuvaj</button><button type="button" id="delete">Obriši</button><button type="button" class="secondary" id="cancel">Otkaži</button></div><p id="error" style="color:#b4232c;margin:0"></p></form></dialog><script>
const buildings={'Maglić':[102,103,104,105,108,112,118,120,208,217],'Koznik':[206,208,212,217],'Kula':[1,3,4,5,6,7,8,9,10,11],'Jelac':[5,7,13]};const units=Object.entries(buildings).flatMap(([b,ns])=>ns.map(n=>b+' '+n));const key='tdm-booking-reservations-v1';let bookings=[];try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))bookings=saved}catch{}const $=id=>document.getElementById(id);const parse=s=>new Date(s+'T12:00:00');const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x};const fmt=d=>d.toLocaleDateString('sr-RS',{day:'2-digit',month:'2-digit'});let base=new Date();base.setHours(12,0,0,0);const save=()=>localStorage.setItem(key,JSON.stringify(bookings));function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function render(){const g=$('grid');g.replaceChildren();$('range').textContent=fmt(base)+' – '+fmt(add(base,20))+' • '+bookings.length+' rezervacija';g.append(el('div','cell head sticky','Apartman'));for(let i=0;i<21;i++){let d=add(base,i);g.append(el('div','cell head',d.toLocaleDateString('sr-RS',{weekday:'short',day:'numeric',month:'numeric'})))}for(const u of units){g.append(el('div','cell sticky',u));for(let i=0;i<21;i++){const date=iso(add(base,i));let c=el('div','cell slot'+([0,6].includes(add(base,i).getDay())?' weekend':''));let b=bookings.find(x=>x.unit===u&&x.start<=date&&x.end>date);if(b){let chip=el('div','booking',b.guest);chip.title=b.guest+' • '+b.start+' – '+b.end;chip.onclick=()=>openForm(b);c.append(chip)}else c.onclick=()=>openForm(null,u,date);g.append(c)}}}function openForm(b=null,u=units[0],date=iso(new Date())){$('form').reset();$('error').textContent='';$('id').value=b?.id||'';$('unit').value=b?.unit||u;$('guest').value=b?.guest||'';$('start').value=b?.start||date;$('end').value=b?.end||iso(add(parse(date),1));$('phone').value=b?.phone||'';$('note').value=b?.note||'';$('delete').hidden=!b;$('formTitle').textContent=b?'Izmeni rezervaciju':'Nova rezervacija';$('modal').showModal()}$('unit').replaceChildren(...units.map(u=>{let o=el('option','',u);o.value=u;return o}));$('form').onsubmit=e=>{e.preventDefault();const id=$('id').value||String(Date.now())+'-'+Math.random().toString(36).slice(2),unit=$('unit').value,guest=$('guest').value.trim(),start=$('start').value,end=$('end').value;if(!guest||!start||!end||end<=start){$('error').textContent='Proveri ime i datume: odlazak mora biti posle dolaska.';return}if(bookings.some(b=>b.id!==id&&b.unit===unit&&start<b.end&&end>b.start)){$('error').textContent='Apartman je već zauzet u ovom periodu.';return}const b={id,unit,guest,start,end,phone:$('phone').value,note:$('note').value};bookings=bookings.filter(x=>x.id!==id);bookings.push(b);save();$('modal').close();render()};$('delete').onclick=()=>{if(confirm('Obrisati ovu rezervaciju?')){bookings=bookings.filter(b=>b.id!==$('id').value);save();$('modal').close();render()}};$('cancel').onclick=()=>$('modal').close();$('new').onclick=()=>openForm();$('prev').onclick=()=>{base=add(base,-7);render()};$('next').onclick=()=>{base=add(base,7);render()};$('today').onclick=()=>{base=new Date();base.setHours(12,0,0,0);render()};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(bookings,null,2)],{type:'application/json'}));a.download='tdm-rezervacije-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.every(b=>b.id&&units.includes(b.unit)&&b.start&&b.end&&b.guest&&b.end>b.start))throw Error('Neispravan fajl');if(!confirm('Zameniti postojeće rezervacije podacima iz kopije?'))return;bookings=data;save();render()}catch(err){alert('Uvoz nije uspeo: '+err.message)}finally{e.target.value=''}};render();
</script></body></html>
